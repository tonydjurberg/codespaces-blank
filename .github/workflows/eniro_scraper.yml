name: Build and test Eniro scraper

on:
  push:
    paths:
      - "eniro_scraper/**"
      - ".github/workflows/eniro_scraper.yml"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: eniro_scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Smoke test Eniro
        working-directory: eniro_scraper
        run: |
          python eniro_private_people.py
      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: eniro-private-people
          path: eniro_scraper/eniro_private_people.csv
          if-no-files-found: error
