name: Build and test MaklarScraper v2

on:
  push:
    paths:
      - "maklarscraper/**"
      - ".github/workflows/build-maklarscraper.yml"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: maklarscraper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build Windows EXE
        run: pyinstaller --clean --noconfirm MaklarScraper_v2.spec

      - name: Live smoke test Booli
        continue-on-error: true
        run: python maklarscraper.py --sources booli --headless --smoke --max-pages 1 --max-profiles 3 --output test_booli.csv

      - name: Live smoke test Hemnet
        continue-on-error: true
        run: python maklarscraper.py --sources hemnet --headless --smoke --max-pages 1 --max-profiles 3 --output test_hemnet.csv

      - name: Live smoke test Mäklarsamfundet
        continue-on-error: true
        run: python maklarscraper.py --sources maklarsamfundet --headless --smoke --max-pages 1 --max-profiles 3 --output test_maklarsamfundet.csv

      - name: Cross-source merge smoke test
        continue-on-error: true
        run: python maklarscraper.py --sources booli,hemnet,maklarsamfundet --headless --smoke --max-pages 1 --max-profiles 3 --output test_combined.csv

      - name: Package EXE and available smoke-test results
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\MaklarScraper_v2.exe package\MaklarScraper_v2.exe
          foreach ($file in @(
            "test_booli.csv",
            "test_hemnet.csv",
            "test_maklarsamfundet.csv",
            "test_combined.csv",
            "maklare_failures.csv"
          )) {
            if (Test-Path $file) {
              Copy-Item $file "package\$file"
            }
          }
          Set-Content package\README.txt "MaklarScraper_v2.exe - Booli + Hemnet + Mäklarsamfundet. EXE build completed. Live smoke-test files are included when available. FMI remains a separate later engineering task."
          Compress-Archive -Path package\* -DestinationPath MaklarScraper_v2_WINDOWS.zip -Force

      - name: Upload actual EXE
        uses: actions/upload-artifact@v4
        with:
          name: MaklarScraper_v2_EXE
          path: maklarscraper/dist/MaklarScraper_v2.exe
          if-no-files-found: error

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: MaklarScraper_v2_WINDOWS
          path: maklarscraper/MaklarScraper_v2_WINDOWS.zip
          if-no-files-found: error

      - name: Upload smoke-test results
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MaklarScraper_v2_RESULTS
          path: |
            maklarscraper/test_booli.csv
            maklarscraper/test_hemnet.csv
            maklarscraper/test_maklarsamfundet.csv
            maklarscraper/test_combined.csv
            maklarscraper/maklare_failures.csv
          if-no-files-found: warn
