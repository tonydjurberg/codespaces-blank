name: Build 150k Swedish company spreadsheets

on:
  push:
    paths:
      - "nya_foretag/**"
      - ".github/workflows/build_swedish_companies.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas
      - name: Download official Bolagsverket and SCB bulk files
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import re, urllib.request
          page='https://bolagsverket.se/apierochoppnadata/hamtaforetagsinformation/nedladdningsbarafiler.2517.html'
          html=urllib.request.urlopen(page, timeout=60).read().decode('utf-8','ignore')
          for name in ['bolagsverket_bulkfil.zip','scb_bulkfil.zip']:
              m=re.search(r'href=["\\']([^"\\']*'+re.escape(name)+r')["\\']', html, re.I)
              if not m:
                  m=re.search(r'https?://[^"\\'\\s<>]*'+re.escape(name), html, re.I)
              if not m: raise SystemExit('Could not locate '+name+' on official Bolagsverket page')
              url=m.group(1)
              if url.startswith('/'): url='https://bolagsverket.se'+url
              print(name, url)
              urllib.request.urlretrieve(url, '/tmp/'+name)
          PY
          mkdir -p data/bulk
          unzip -o /tmp/bolagsverket_bulkfil.zip -d data/bulk/bolagsverket
          unzip -o /tmp/scb_bulkfil.zip -d data/bulk/scb
      - name: Build master CSV
        run: python nya_foretag/build_companies.py data/bulk data/master_150k.csv
      - name: Validate phone coverage
        run: |
          python - <<'PY'
          import pandas as pd
          p='data/master_150k.csv'
          df=pd.read_csv(p,dtype=str).fillna('')
          if len(df)<150000: raise SystemExit(f'Only {len(df)} rows; refusing to package 150000')
          if df.organisationsnummer.duplicated().any(): raise SystemExit('Duplicate organisation numbers')
          if (df.företagsnamn=='').any(): raise SystemExit('Blank company names')
          print('ROWS',len(df))
          print('PHONE',df.telefon.str.strip().ne('').sum())
          print('MOBILE',df.mobil.str.strip().ne('').sum())
          PY
      - name: Split into 15 ZIP files
        run: |
          python - <<'PY'
          import pandas as pd, zipfile, pathlib
          df=pd.read_csv('data/master_150k.csv',dtype=str).fillna('')
          out=pathlib.Path('dist'); out.mkdir(exist_ok=True)
          for i,start in enumerate(range(0,150000,10000),1):
              csvp=out/f'svenska_foretag_{i:02d}.csv'
              zipp=out/f'svenska_foretag_{i:02d}.zip'
              df.iloc[start:start+10000].to_csv(csvp,index=False,encoding='utf-8-sig')
              with zipfile.ZipFile(zipp,'w',zipfile.ZIP_DEFLATED) as z: z.write(csvp,csvp.name)
              csvp.unlink()
          PY
      - name: Upload 15 ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: svenska-foretag-150000
          path: dist/*.zip
          retention-days: 7
