name: Build Windows EXE

on:
  push:
    paths:
      - "google_maps_maklarscraper.py"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MaklarScraper_v1 google_maps_maklarscraper.py
      - name: Smoke test
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\\MaklarScraper_v1.exe")) { throw "EXE was not created" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist\\MaklarScraper_v1.exe" "package\\MaklarScraper_v1.exe"
          Copy-Item "README.md" "package\\README.md"
          Compress-Archive -Path "package\\*" -DestinationPath "MaklarScraper_v1_Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MaklarScraper_v1_Windows
          path: MaklarScraper_v1_Windows.zip
