name: Build Windows EXE

on:
  push:
    branches: ["gmaps-scraper"]
    paths:
      - "GoogleMapsScraper.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Syntax check
        run: python -m py_compile GoogleMapsScraper.py

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GoogleMapsScraper GoogleMapsScraper.py

      - name: Smoke test
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\GoogleMapsScraper.exe")) { throw "EXE was not created" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist\GoogleMapsScraper.exe" "package\GoogleMapsScraper.exe"
          Copy-Item "README.md" "package\README.md"
          Compress-Archive -Path "package\*" -DestinationPath "GoogleMapsScraper_Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleMapsScraper-Windows
          path: GoogleMapsScraper_Windows.zip
