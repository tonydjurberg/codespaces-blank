name: Build Industritorget Windows EXE

on:
  push:
    paths:
      - "industritorget_scraper/**"
      - ".github/workflows/build_industritorget_windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python -m pip install -r industritorget_scraper/requirements.txt pyinstaller
      - name: Build scraper engine EXE
        working-directory: industritorget_scraper
        run: pyinstaller --noconfirm --clean --onefile --console --name industritorget_scraper industritorget_scraper.py
      - name: Build GUI EXE
        working-directory: industritorget_scraper
        run: pyinstaller --noconfirm --clean --onedir --windowed --name IndustritorgetScraper IndustritorgetScraper.py
      - name: Add scraper engine EXE
        shell: pwsh
        run: Copy-Item industritorget_scraper/dist/industritorget_scraper.exe industritorget_scraper/dist/IndustritorgetScraper/industritorget_scraper.exe
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        working-directory: industritorget_scraper
        run: iscc installer.iss
      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path industritorget_scraper/dist/IndustritorgetScraper/* -DestinationPath IndustritorgetScraper_Portable.zip -Force
      - name: Upload installer and portable
        uses: actions/upload-artifact@v4
        with:
          name: IndustritorgetScraper-Windows
          path: |
            industritorget_scraper/installer/IndustritorgetScraper_Setup.exe
            IndustritorgetScraper_Portable.zip
