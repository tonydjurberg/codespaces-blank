name: WhatsApp CRM Check

on:
  push:
    paths:
      - "whatsapp-crm/**"
      - ".github/workflows/whatsapp_crm_check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate WhatsApp CRM
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('whatsapp-crm/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:[^>]*)>([\\s\\S]*?)<\\/script>/g)].map(m => m[1]);
          if (!scripts.length) throw new Error('No inline script found');
          for (const script of scripts) {
            new Function(script);
          }
          const required = [
            'Novo cliente','Nova mensagem','Nova compra','Novo lembrete',
            'Petshop','WhatsApp','localStorage','Conversas','Clientes',
            'Lembretes','Automação','Configurações'
          ];
          const missing = required.filter(x => !html.includes(x));
          if (missing.length) throw new Error('Missing required CRM elements: ' + missing.join(', '));
          console.log('WhatsApp CRM validation: OK');
          console.log('Inline scripts:', scripts.length);
          NODE
