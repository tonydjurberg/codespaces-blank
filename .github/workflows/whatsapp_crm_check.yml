name: WhatsApp CRM Check

on:
  push:
    paths:
      - "whatsapp-crm/**"
      - ".github/workflows/whatsapp_crm_check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate WhatsApp CRM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("whatsapp-crm/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:[^>]*)>(.*?)</script>", html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No inline script found")
          Path("/tmp/crm.js").write_text("\n".join(scripts), encoding="utf-8")
          required = [
              "Novo cliente","Nova mensagem","Nova compra","Novo lembrete",
              "Petshop","WhatsApp","localStorage","Conversas","Clientes",
              "Lembretes","Automação","Configurações"
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit("Missing required CRM elements: " + ", ".join(missing))
          print("WhatsApp CRM HTML validation: OK")
          print("Inline scripts:", len(scripts))
          PY
          node --check /tmp/crm.js
          echo "WhatsApp CRM JavaScript syntax: OK"
